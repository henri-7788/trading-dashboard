<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Trading Dashboard</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #08090b;
        color: #e7e9ed;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      .card {
        text-align: center;
        max-width: 22rem;
        padding: 1.5rem;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #d9564b;
        display: inline-block;
        margin-bottom: 1rem;
      }
      h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 0.5rem; }
      p { font-size: 0.9rem; color: #a8afb9; line-height: 1.5; margin: 0 0 1.25rem; }
      button {
        background: #4f8cff;
        color: #08090b;
        border: none;
        border-radius: 6px;
        padding: 0.55rem 1.1rem;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button:hover { background: #2f5bb0; color: #e7e9ed; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="dot"></span>
      <h1>Keine Verbindung</h1>
      <p>Das Trading Dashboard braucht eine Internetverbindung für aktuelle Kurse und Kontostände. Zuletzt geladene Seiten bleiben verfügbar, sobald du wieder online bist.</p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </div>
  </body>
</html>
