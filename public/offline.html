<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Trading Dashboard</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050609;
        color: #f2f4f8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
      }
      .blob {
        position: fixed;
        border-radius: 999px;
        filter: blur(110px);
        z-index: 0;
      }
      .blob-a { top: -20%; left: -15%; width: 60vmax; height: 60vmax; background: rgba(10, 132, 255, 0.28); }
      .blob-b { bottom: -25%; right: -15%; width: 55vmax; height: 55vmax; background: rgba(50, 215, 75, 0.2); }
      .card {
        position: relative;
        z-index: 1;
        text-align: center;
        max-width: 22rem;
        padding: 2rem 1.75rem;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 16px 40px -16px rgba(0, 0, 0, 0.55), inset 0 1px 0 0 rgba(255, 255, 255, 0.14);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #ff453a;
        display: inline-block;
        margin-bottom: 1rem;
      }
      h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 0.5rem; }
      p { font-size: 0.9rem; color: #aeb6c4; line-height: 1.5; margin: 0 0 1.25rem; }
      button {
        background: rgba(10, 132, 255, 0.15);
        border: 1px solid rgba(10, 132, 255, 0.3);
        color: #0a84ff;
        border-radius: 999px;
        padding: 0.6rem 1.3rem;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button:hover { background: rgba(10, 132, 255, 0.25); }
    </style>
  </head>
  <body>
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="card">
      <span class="dot"></span>
      <h1>Keine Verbindung</h1>
      <p>Das Trading Dashboard braucht eine Internetverbindung für aktuelle Kurse und Kontostände. Zuletzt geladene Seiten bleiben verfügbar, sobald du wieder online bist.</p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </div>
  </body>
</html>
